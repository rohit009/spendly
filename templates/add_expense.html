{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expense_form.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add an expense</h1>
            <p class="auth-subtitle">Record where every rupee went</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}" class="expense-form">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="amount-field">
                        <span class="amount-prefix" aria-hidden="true">₹</span>
                        <input type="number" id="amount" name="amount"
                               class="form-input" inputmode="decimal"
                               step="0.01" min="0.01" max="{{ max_amount }}"
                               placeholder="450.00"
                               value="{{ values.amount }}" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input form-select" required>
                        <option value="" disabled {{ 'selected' if values.category not in categories }}>Choose a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}" {{ 'selected' if c == values.category }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           max="{{ today }}" value="{{ values.date }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="optional">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="{{ max_description }}"
                           placeholder="e.g. Groceries"
                           value="{{ values.description }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save expense</button>
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
